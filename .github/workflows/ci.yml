name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        id: go
        with:
          go-version-file: go.mod
          # go.mod has no `require` and there is no go.sum (I1), so there is nothing
          # to cache and nothing for the cache key to hash.
          cache: false

      # The four checks of README "Verification", in the same order.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      # Coverage runs separately and without -race: the acceptance corpus gives each
      # example a 2 s Run deadline (corpus_test.go), and race detection on top of
      # coverage instrumentation is slow enough to trip it on a shared runner.
      # -coverpkg=./... credits the library for what the cmd/mzs and engine tests
      # exercise in it; drop it if the examples ever start timing out here too.
      - name: coverage profile
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...

      # The number goes into the run summary as well as the log, so it is readable
      # without Codecov — which matters on a fork, where the upload cannot happen.
      - name: coverage summary
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}')
          echo "coverage: $total of statements"
          echo "**Coverage:** $total of statements" >> "$GITHUB_STEP_SUMMARY"

      # Codecov. This is the one step that can fail for a reason that is not the code,
      # so it has two rules:
      #
      #   * with CODECOV_TOKEN set, a failed upload fails the job — a coverage report
      #     that quietly stops arriving is worse than a red build;
      #   * without it the job stays green and leaves an annotation instead. A fork and
      #     a fresh clone have no secret and must not be red for a reason they cannot
      #     fix; this branch is also protected, and Codecov refuses an untokened upload
      #     from a protected branch ("Token required because branch is protected").
      #
      # The alternative to the secret is OIDC: add `id-token: write` to `permissions`
      # above and `use_oidc: true` here, once the repository is linked on codecov.io.
      - name: upload to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: morzecrew/mzs
          files: ./coverage.out
          disable_search: true # exactly the profile above; nothing is guessed
          flags: unit # a second lane (another OS, another Go) gets its own
          name: ubuntu-go${{ steps.go.outputs.go-version }}
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}

      - name: note a missing codecov token
        if: ${{ secrets.CODECOV_TOKEN == '' }}
        run: |
          msg="CODECOV_TOKEN is not set, so the profile was measured but not uploaded."
          msg="$msg Its total is in the run summary. Add the secret in Settings →"
          msg="$msg Secrets and variables → Actions."
          echo "::warning title=Coverage was not uploaded::$msg"

  cli:
    name: cli smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # Every shipped example must still compile under the real CLI, which is the one
      # check corpus_test.go cannot make: it runs them through the library. One file per
      # invocation — the CLI takes a single program and turns the rest into $ARGV — and
      # with --time, because 29_time_scheduling.mzs includes a gated module and --check
      # resolves modules at compile time.
      - name: mzs --check examples
        run: |
          go build -o /tmp/mzs ./cmd/mzs
          status=0
          for f in examples/*.mzs; do
            /tmp/mzs --check --time "$f" || status=1
          done
          exit $status
